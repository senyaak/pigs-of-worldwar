# The docs gate: every relative link in the repo's markdown lands on a file,
# and the fleet's pinned copy is unedited.
#
# Separate from ci.yml because that one skips doc-only changes on purpose, and
# a doc-only change is exactly where a link breaks: a file is split, moved or
# renamed and the indexes pointing at it are not. No `npm ci` — the checker is
# plain Node and git.

name: Docs

on:
  push:
    branches: [master, net]
  pull_request:
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: node .claude/fleet/links.mjs

      # The fleet's roles and process are a pinned copy of senyaak/claude-fleet;
      # an edit made here instead of there would be lost on the next update.
      - run: node .claude/fleet/fleet.mjs verify
