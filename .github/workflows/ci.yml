# What a build server can actually hold this repo to.
#
# Not the whole suite: e2e/ is written against a REAL installation of the
# original game (docs/testing.md) — most of it launches the app and reads the
# player's own Maps/, and a runner has neither. What it CAN run is every test
# tagged **@nodata**, which is the engine half — the rules, stepped directly,
# with no window and no game files. The tag is written by hand, one per test,
# and `npm run nodata` checks that every claim matches the file it is in.
#
# LINUX, though the app targets Windows, and the reason is the bill: this repo
# is private, where a Windows runner costs double. Nothing these steps do is
# platform-specific — bundling, type checking and stepping the engine — and the
# Windows path is walked on every release anyway, because release.yml runs the
# same three checks on windows-latest before it packages. One word here moves
# it back the day a path bug slips through.

name: CI

on:
  push:
    branches: [master, net]
    # A doc-only commit has nothing here to break, and this repo writes a lot of
    # prose. The rule is the same one the heroes editor's build.yml settled on
    # for its own triggers: do not spend a run re-checking what was not touched.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The domain split is checked BEFORE the build, the way `test:e2e` does
      # it: a breach here is an architecture failure, not a type error, and
      # TypeScript has never caught one of them (scripts/boundaries.mjs).
      - run: npm run boundaries

      - run: npm run typecheck

      - run: npm run build

      # The split itself, before it is trusted: a test tagged @nodata that
      # actually needs the install would fail here for a confusing reason, and
      # an untagged pure test would silently not run at all.
      - run: npm run nodata

      # No `playwright install` — these specs never open a browser. They step
      # the engine directly and assert numbers.
      - run: npm run test:nodata
