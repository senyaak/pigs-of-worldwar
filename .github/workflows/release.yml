# Cutting a release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# builds the Windows installer and the portable zip (electron-builder.yml) and
# publishes them on a GitHub Release. Run it by hand from the Actions tab
# instead and it builds the same artifacts and attaches them to the run,
# without publishing anything.
#
# The build carries NO game data — the app reads the player's own installation
# at runtime — so there is nothing here that copies an asset out of the game.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # For `gh release create`. Nothing else in this workflow writes.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A release that fails the checks is not a release. Same three as CI,
      # plus the engine specs.
      - run: npm run boundaries
      - run: npm run typecheck
      - run: npm run test:pure

      # The tag IS the version: a mismatch means package.json was not bumped,
      # and the artifacts would carry a name nobody asked for.
      - name: The tag and package.json agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(node -p "require('./package.json').version")
          echo "tag $tagged, package.json $packaged"
          test "$tagged" = "$packaged"

      - name: Build the installer and the zip
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: pigs-of-worldwar-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `--notes` is the flag that COMBINES with --generate-notes: gh
          # prepends it to the generated changelog. `--notes-file` does not.
          notes=$(cat <<'NOTES'
          A remake ENGINE, not a game: it reads models, maps, textures and sounds
          out of your own installation of Hogs of War (2000) and ships none of
          them. Point it at a folder containing `warhogs_.exe` on first launch,
          or pass `--game-dir=<path>`.

          Two downloads, same build: the `.exe` is a per-user installer, the
          `.zip` is the same app unpacked. Neither is code-signed, so Windows
          SmartScreen will want a "more info" click.
          NOTES
          )
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.zip \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$notes"
